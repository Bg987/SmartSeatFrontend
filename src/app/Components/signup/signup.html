<div class="signup-container">
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
    <h2>Sign Up</h2>

    <!-- Name -->
    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Enter your name">
      <div class="error" *ngIf="submitted && f['name'].errors">
        <small *ngIf="f['name'].errors?.['required']">Name is required.</small>
        <small *ngIf="f['name'].errors?.['minlength']">Name must be at least 3 characters.</small>
      </div>
    </div>

    <!-- Mobile Number -->
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="text" formControlName="mobileNumber" placeholder="Enter your mobile number">
      <div class="error" *ngIf="submitted && f['mobileNumber'].errors">
        <small *ngIf="f['mobileNumber'].errors?.['required']">Mobile number is required.</small>
        <small *ngIf="f['mobileNumber'].errors?.['pattern']">Enter a valid 10-digit number.</small>
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="mail" placeholder="Enter your email">
      <div class="error" *ngIf="submitted && f['mail'].errors">
        <small *ngIf="f['mail'].errors?.['required']">Email is required.</small>
        <small *ngIf="f['mail'].errors?.['email']">Enter a valid email.</small>
      </div>
    </div>

    <!-- Role Dropdown -->
    <div class="form-group">
      <label>Role</label>
      <select formControlName="role">
        <option value="student">Student</option>
        <option value="college">College</option>
        <option value="university">University</option>
      </select>
      <div class="error" *ngIf="submitted && f['role'].errors">
        <small *ngIf="f['role'].errors?.['required']">Role is required.</small>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password">
      <div class="error" *ngIf="submitted && f['password'].errors">
        <small *ngIf="f['password'].errors?.['required']">Password is required.</small>
        <small *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</small>
      </div>
    </div>

    <button type="submit">Sign Up</button>

    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </form>
</div>
