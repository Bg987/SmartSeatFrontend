<div class="container">

  <!--  EXAM CARD -->
  <div *ngIf="!showSittingPlan" class="exam-card" (click)="openSittingPlan()">
    <div class="exam-badge">Exam</div>
    <h2>{{ examName }}</h2>
    <p>Click to View Sitting Arrangement</p>
  </div>

  <!--  SITTING PLAN SECTION -->
  <div *ngIf="showSittingPlan" class="plan-wrapper">

    <!-- Header -->
    <div class="plan-header">
      <div>
        <h2>{{ examName }}</h2>
        <p *ngIf="roomNumber">
          Room {{ roomNumber }} | Capacity: {{ capacity }}
        </p>
      </div>

      <button class="back-btn" (click)="showSittingPlan = false">
        ← Back
      </button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <select [(ngModel)]="selectedRoom" (ngModelChange)="changeRoom($event)">
        <option *ngFor="let room of uniqueRooms" [ngValue]="room">
          Room {{ roomNumber }}
        </option>
      </select>

      <input
        type="text"
        placeholder="Search Enrollment..."
        [(ngModel)]="searchText"
        (input)="searchStudent()"
      />
    </div>

    <!-- Stats -->
    <div class="stats">
      <div>
        <span>Total</span>
        <strong>{{ capacity }}</strong>
      </div>
      <div>
        <span>Occupied</span>
        <strong>{{ getOccupiedCount() }}</strong>
      </div>
      <div>
        <span>Empty</span>
        <strong>{{ getEmptySeats() }}</strong>
      </div>
    </div>

    <!-- GRID -->
    <div class="grid-wrapper" *ngIf="rows.length">

      <!-- Column Numbers -->
      <div class="row header-row">
        <div class="corner"></div>
        <div class="col-header" *ngFor="let col of columns">
          {{ col }}
        </div>
      </div>

      <!-- Seat Rows -->
      <div class="row" *ngFor="let row of rows">
        <div class="row-header">{{ row }}</div>

        <div
          class="seat"
          *ngFor="let col of columns"
          [ngClass]="{
            occupied: getStudent(row, col),
            empty: !getStudent(row, col)
          }"
        >
          <span *ngIf="getStudent(row, col)">
            {{ getStudent(row, col)?.enrollment }}
          </span>
        </div>
      </div>

    </div>

  </div>

</div>
