<div class="upload-container">
    <h2>Update Student Image</h2>

    <div class="form-group">
        <label>Enrollment Number:</label>
        <input type="text" [(ngModel)]="enrollmentNo" placeholder="Enter Enrollment No" [disabled]="isLoading">
    </div>

    <div class="form-group">
        <label>Select Profile Image (JPG only):</label>
        <input type="file" (change)="onFileSelected($event)" accept=".jpg,.jpeg" [disabled]="isLoading">
    </div>

    <button (click)='onSubmit()' [disabled]="isLoading">
        <span *ngIf="!isLoading">Upload Image</span>
        <span *ngIf="isLoading" class="loader-text">Processing Embeddings...</span>
    </button>

    <div *ngIf="isLoading" class="spinner"></div>

    <p [ngClass]="{'error': isError, 'success': !isError}" *ngIf="message">
        {{ message }}
    </p>
</div>
