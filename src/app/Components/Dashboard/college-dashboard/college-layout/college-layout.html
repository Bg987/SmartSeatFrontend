<div class="app-container">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <!-- College Name -->
    <div class="college-name">
      {{ userName || 'College Name' }}
    </div>

    <h2 class="logo">SmartSeat</h2>

    <ul class="menu">

      <li routerLink="/college-dashboard/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </li>

      <li class="dropdown">
        <span>Add Students</span>

        <ul class="submenu">
          
          <li routerLink="/college-dashboard/uploadStudent"
              routerLinkActive="active">
            Upload CSV
          </li>

          <li routerLink="/college-dashboard/addStudents"
              routerLinkActive="active">
            Add via Form
          </li>

        </ul>
      </li>

      <li routerLink="/college-dashboard/uploadRooms"
          routerLinkActive="active">
        Upload Rooms Information
      </li>

      <li routerLink="/college-dashboard/sittingPlan"
          routerLinkActive="active">
        Get Sitting Plan
      </li>

    </ul>

    <button type="button"
            class="logout-btn"
            (click)="logout()">
      Logout
    </button>

  </aside>

  <!-- ===== RIGHT SIDE CONTENT ===== -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
