<div class="form-wrapper">
  <header class="form-header">
    <h2 class="main-title">Manual Student Enrollment</h2>
    <p class="subtitle">Directly register a student node into the institutional registry.</p>
  </header>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="themed-form">

    <!-- BASIC INFO -->
    <div class="form-section">
      <div class="form-row">
        <div class="input-section">
          <label class="field-label">Enrollment Number</label>
          <input type="text" formControlName="enrollmentNo" placeholder="e.g. EN12345">
        </div>

        <div class="input-section wide">
          <label class="field-label">Full Legal Name</label>
          <input type="text" formControlName="name" placeholder="Enter student's full name">
        </div>
      </div>

      <div class="form-row">
        <div class="input-section">
          <label class="field-label">Institutional Email</label>
          <input type="email" formControlName="email" placeholder="student@university.edu">
        </div>

        <div class="input-section">
          <label class="field-label">Mobile Number</label>
          <input type="text" formControlName="mobileNumber" placeholder="10-digit primary contact">
        </div>
      </div>
    </div>

    <!-- ACADEMIC INFO -->
    <div class="form-section row-split">
      <div class="input-section">
        <label class="field-label">Academic Branch</label>
        <select formControlName="branch">
          <option value="">Select Branch</option>
          <option value="CSE">Computer Science And Engineering</option>
          <option value="IT">Information Technology</option>
          <option value="EC">Electronics</option>
          <option value="ME">Mechanical</option>
          <option value="CE">Civil</option>
        </select>
      </div>

      <div class="input-section">
        <label class="field-label">Specialization</label>
        <input type="text" formControlName="specialization" placeholder="e.g. AI / Data Science">
      </div>

      <div class="input-section">
        <label class="field-label">Semester</label>
        <input type="number" formControlName="semester">
      </div>
    </div>

    <!-- SUBJECTS -->
    <div class="subjects-canvas">
      <h3 class="canvas-title">Academic Curriculum (Subject Codes)</h3>
      <div formArrayName="subjects">
        <div *ngFor="let sub of subjects.controls; let i=index" class="subject-row">
          <input [formControlName]="i" placeholder="Enter Code (e.g. CS101)">
          <button type="button" class="remove-btn" (click)="removeSubject(i)">
            <span class="icon">🗑️</span>
          </button>
        </div>
      </div>
      <button type="button" class="add-node-btn" (click)="addSubject()">
        <span class="icon">➕</span> Add Subject Entry
      </button>
    </div>

    <!-- FOOTER -->
    <div class="footer-section">

      <!-- BACKLOG SWITCH -->
      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" formControlName="hasBacklog" id="backlogSwitch">
          <span class="slider"></span>
        </label>
        <label for="backlogSwitch" class="switch-label">
          Student currently has active Backlog
        </label>
      </div>

      <!-- 🔥 BACKLOG SECTION (NEW ADDED) -->
      <div *ngIf="showBacklogUI" class="subjects-canvas backlog-section">

        <h3 class="canvas-title">Backlog Subjects</h3>

        <div formArrayName="backlogSubjects">
          <div *ngFor="let sub of backlogSubjects.controls; let i=index" class="subject-row">
            <input [formControlName]="i" placeholder="Enter Backlog Subject Code (e.g. CS201)">
            <button type="button" class="remove-btn" (click)="removeBacklogSubject(i)">
              <span class="icon">🗑️</span>
            </button>
          </div>
        </div>

        <button type="button" class="add-node-btn" (click)="addBacklogSubject()">
          <span class="icon">➕</span> Add Backlog Subject
        </button>

      </div>

      <!-- SUBMIT -->
      <button type="submit"
              class="prime-btn success"
              [disabled]="studentForm.invalid">
        Finalize Enrollment
      </button>

    </div>

  </form>
</div>
