<div class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">SmartSeat</h2>

    <ul class="menu">
      <li class="active">🏛️ Dashboard</li>
      <li>🏫 Colleges</li>
      <li>📊 Reports</li>
      <li>⚙️ Settings</li>
    </ul>

    <button type="button" class="logout-btn" (click)="logout()">Logout</button>
  </aside>

  <!-- RIGHT CONTENT -->
  <main class="content">

    <!-- TOP BAR -->
    <div class="topbar">
      <h1>Welcome, {{ universityName }}</h1>
      <button class="add-btn" routerLink="/add-college">+ Add New College</button>
    </div>

    <!-- COLLEGE LIST -->
    <div class="card">
      <h3>Registered Colleges</h3>

      <p *ngIf="colleges.length === 0">No colleges registered yet.</p>

      <table *ngIf="colleges.length > 0">
        <thead>
          <tr>
            <th>#</th>
            <th>College Name</th>
            <th>Email</th>
            <th>Mobile</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let college of colleges; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ college.name }}</td>
            <td>{{ college.mail }}</td>
            <td>{{ college.mobileNumber }}</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</div>
