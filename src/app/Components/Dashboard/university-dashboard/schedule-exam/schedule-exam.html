<div class="schedule-container">

    <div *ngIf="!isConfiguring">
        <h1 class="page-title">University Exam Scheduler</h1>
        <br>
        <header class="filter-header">
            <input type="text" [(ngModel)]="searchText" placeholder="Search...">
            <select [(ngModel)]="selectedDept">
                <option value="">All Depts</option>
                <option *ngFor="let d of uniqueDepts" [value]="d">{{d}}</option>
            </select>
            <select [(ngModel)]="selectedBranch">
                <option value="">All Branches</option>
                <option *ngFor="let b of uniqueBranches" [value]="b">{{b}}</option>
            </select>
            <select [(ngModel)]="selectedSem">
                <option value="">All Sems</option>
                <option *ngFor="let s of uniqueSems" [value]="s">Sem {{s}}</option>
            </select>

            <button class="btn-proceed" [disabled]="selectedSubjects.length === 0" (click)="proceedToConfigure()">
                Configure ({{selectedSubjects.length}}) Subjects
            </button>
        </header>

        <div class="card-grid" *ngIf="filteredSubjects.length > 0; else noData">
            <div class="subject-card" *ngFor="let s of filteredSubjects"
                [class.selected]="isSubjectSelected(s.subjectId)" (click)="toggleSelection(s)">
                <span class="subject-id-badge">{{ s.subjectId }}</span>
                <h3>{{ s.subjectName }}</h3>
                <p>{{s.department}} | {{s.branch}} | Sem {{s.semester}}</p>
                <div class="check-indicator" *ngIf="isSubjectSelected(s.subjectId)">✓ Selected</div>
            </div>
        </div>
    </div>

    <div class="config-view" *ngIf="isConfiguring">
        <div class="config-header">
            <button (click)="isConfiguring = false" class="btn-back">← Back to Selection</button>
            <h2>Set Individual Exam Details</h2>
        </div>

        <div class="config-table-wrapper">
            <table class="config-table">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Exam Date</th>
                        <th>Start Time</th>
                        <th>Duration (Min)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of selectedSubjects; let i = index">
                        <td>
                            <div class="sub-info">
                                <strong>{{item.subjectId}}</strong>
                                <span>{{item.subjectName}}</span>
                            </div>
                        </td>
                        <td><input type="date" [(ngModel)]="item.examDate" class="form-input"></td>
                        <td><input type="time" [(ngModel)]="item.startTime" class="form-input"></td>
                        <td><input type="number" [(ngModel)]="item.duration" class="form-input" style="width: 80px;">
                        </td>
                        <td>
                            <button class="btn-remove" (click)="selectedSubjects.splice(i, 1)">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="config-footer">
            <button class="btn-finalize" (click)="confirmAllSchedules()">Finalize All Exams</button>
        </div>
        <div>{{response}}</div>
    </div>

    <ng-template #noData>
        <div class="empty-state">No matching subjects found.</div>
    </ng-template>
</div>
