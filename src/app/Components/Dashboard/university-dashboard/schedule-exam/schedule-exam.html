<div class="schedule-container">
    <h1 class="page-title">University Exam Scheduler</h1>
    <p class="page-subtitle">AI-Assisted Semester Synchronization</p>

    <div class="config-view" *ngIf="!isConfiguring">
        <header class="filter-header" style="max-width: 800px; margin: 0 auto;">
            <div style="flex: 1;">
                <label style="display:block; margin-bottom:5px; font-weight:700;">Semester</label>
                <select [(ngModel)]="aiSemester">
                    <option *ngFor="let s of uniqueSems" [value]="s">Semester {{s}}</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="display:block; margin-bottom:5px; font-weight:700;">Start Date</label>
                <input type="date" [(ngModel)]="aiStartDate" class="form-input">
            </div>
            <div style="flex: 1;">
                <label style="display:block; margin-bottom:5px; font-weight:700;">Start Time</label>
                <input type="time" [(ngModel)]="aiStartTime" class="form-input">
            </div>
            <button class="btn-proceed" [disabled]="isLoading" (click)="generateAiDraft()" style="margin-top: 22px;">
                {{ isLoading ? 'Generating...' : '✨ Generate Master Plan' }}
            </button>
        </header>

        <div *ngIf="response" class="empty-state" style="margin-top: 20px; border-style: solid;">
            {{ response }}
        </div>
    </div>

    <div class="config-view" *ngIf="isConfiguring">
        <div class="config-header">
            <button (click)="isConfiguring = false" class="btn-back">← Reschedule</button>
            <h2>Review Master Timetable: Semester {{aiSemester}}</h2>
        </div>

        <div class="config-table-wrapper">
            <table class="config-table">
                <thead>
                    <tr>
                        <th>Branch & Subject</th>
                        <th>Exam Date</th>
                        <th>Start Time</th>
                        <th>Duration</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of selectedSubjects; let i = index">
                        <td>
                            <div class="sub-info">
                                <span class="subject-id-badge">{{item.branch}}</span>
                                <strong>{{item.subjectId}}</strong>
                                <span>{{item.subjectName}}</span>
                            </div>
                        </td>
                        <td><input type="date" [(ngModel)]="item.examDate" class="form-input"></td>
                        <td><input type="time" [(ngModel)]="item.startTime" class="form-input"></td>
                        <td><input type="number" [(ngModel)]="item.duration" class="form-input" style="width: 80px;">
                        </td>
                        <td>
                            <button class="btn-remove" (click)="selectedSubjects.splice(i, 1)">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="config-footer">
            <button class="btn-finalize" [disabled]="isLoading" (click)="confirmAllSchedules()">
                {{ isLoading ? 'Saving...' : 'Confirm' }}
            </button>
        </div>
    </div>
</div>
