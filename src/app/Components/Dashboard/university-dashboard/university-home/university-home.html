<div class="page-header">
  <div class="header-text">
    <h1>Registered Colleges</h1>
    <p>Viewing nodes currently connected to the {{universityName}}</p>
  </div>
  <div class="header-actions">
  </div>
</div>

<div class="data-card">
  <ng-container *ngIf="colleges$ | async as colleges">

    <div class="empty-state" *ngIf="colleges.length === 0">
      <div class="empty-icon">📁</div>
      <p>No colleges registered yet.</p>
      <button class="prime-btn" routerLink="/university-dashboard/addCollege">Add Your First College</button>
    </div>

    <div class="table-container" *ngIf="colleges.length > 0">
      <table class="custom-table">
        <thead>
          <tr>
            <th>#</th>
            <th>College Name</th>
            <th>Email Identity</th>
            <th>Contact Number</th>
          
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let college of colleges; let i = index">
            <td><span class="index-badge">{{ i + 1 }}</span></td>
            <td><strong>{{ college.name }}</strong></td>
            <td><span class="email-tag">{{ college.mail }}</span></td>
            <td>{{ college.mobileNumber }}</td>
            <td class="text-right">
              
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </ng-container>
</div>
