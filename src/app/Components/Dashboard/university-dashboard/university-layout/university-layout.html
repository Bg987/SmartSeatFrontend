<div class="dashboard-root" [class.dark-mode]="isDarkMode">
  <aside class="glass-sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">S</div>
      <h1>SmartSeat<span>.</span></h1>
    </div>

    <nav class="side-nav">
      <div class="nav-section">
        <span class="section-title">Core Control</span>
        <ul>
          <li routerLink="/university-dashboard/dashboard" routerLinkActive="active">
            <i class="icon">📊</i> <span>Overview</span>
          </li>
          <li routerLink="/university-dashboard/changePassword" routerLinkActive="active">
            <i class="icon">🔐</i> <span>Security</span>
          </li>
        </ul>
      </div>

      <div class="nav-section">
        <span class="section-title">Institutional</span>
        <ul>
          <li class="has-submenu">
            <i class="icon">🏫</i> <span>Colleges</span>
            <ul class="sub-nav">
              <li routerLink="/university-dashboard/addCollege" routerLinkActive="active">Manual Entry</li>
              <li routerLink="/university-dashboard/csv" routerLinkActive="active">Bulk Import</li>
            </ul>
          </li>
          <li routerLink="/university-dashboard/addSubjects" routerLinkActive="active">
            <i class="icon">📖</i> <span>Subjects</span>
          </li>
        </ul>
      </div>

      <div class="nav-section">
        <span class="section-title">Engine</span>
        <ul>
          <li routerLink="/university-dashboard/addTimeTable" routerLinkActive="active">
            <i class="icon">📅</i> <span>Schedules</span>
          </li>
          <li routerLink="/university-dashboard/viewSeatingPlan" routerLinkActive="active">
            <i class="icon">👁️</i> <span>View Seating</span>
          </li>
         <li routerLink="/university-dashboard/genSeatPlan" routerLinkActive="active">
                  <i class="icon">👁️</i> <span>Generate Seating</span>
                </li>
        </ul>
      </div>
    </nav>
    
    <div class="sidebar-footer">
      <div class="theme-switch" (click)="toggleTheme()">
        <div class="switch-content">
          <span>{{ isDarkMode ? '🌙 Dark' : '☀️ Light' }}</span>
        </div>
        <div class="switch-track">
          <div class="switch-thumb" [class.active]="isDarkMode"></div>
        </div>
      </div>
      <button type="button" class="logout-btn" (click)="onLogout()">
        <span class="icon">🚪</span> Terminate Session
      </button>
    </div>
  </aside>

  <main class="main-canvas">
    <div class="content-viewport">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
