<div class="dashboard-root" [class.dark-mode]="isDarkMode">


    <aside class="glass-sidebar">
        <app-notification></app-notification>
        <div class="sidebar-brand">
            <div class="brand-logo">S</div>
            <h1>SmartSeat<span></span></h1>
        </div>

        <nav class="side-nav">
            <div class="nav-section">
                <span class="section-title">Personal</span>
                <ul>
                    <li routerLink="/student-dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i class="icon">🏠</i> <span>My Dashboard</span>
                    </li>
                    <li routerLink="/student-dashboard/changePassword" routerLinkActive="active">
                        <i class="icon">🔐</i> <span>Change Password</span>
                    </li>
                </ul>
            </div>

            <div class="nav-section">
                <span class="section-title">Examination</span>
                <ul>
                    <li routerLink="/student-dashboard/upcomingExams" routerLinkActive="active">
                    <i class="icon">📅</i> <span>Upcoming Exams</span>
                    </li>
                </ul>
            </div>

            <div class="nav-section">
                <span class="section-title">Academic</span>
                <ul>
                    <li routerLink="/student-dashboard/StudentResult" routerLinkActive="active">
                        <i class="icon">🏆</i> <span>Exam Results</span>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-switch" (click)="toggleTheme()">
                <div class="switch-content">
                    <span>{{ isDarkMode ? '🌙 ' : '☀️' }}</span>
                </div>
                <div class="switch-track">
                    <div class="switch-thumb" [class.active]="isDarkMode"></div>
                </div>
            </div>
            <button type="button" class="logout-btn" (click)="onLogout()">
                <span class="icon">🚪</span> Log Out
            </button>
        </div>
    </aside>

<main class="main-canvas">
    <div class="content-viewport">
        <router-outlet></router-outlet>
    </div>
</main>
</div>
